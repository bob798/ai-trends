name: fde-sandbox CI

on:
  push:
    paths:
      - "fde-sandbox/**"
      - ".github/workflows/fde-sandbox-ci.yml"
  pull_request:
    paths:
      - "fde-sandbox/**"
      - ".github/workflows/fde-sandbox-ci.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fde-sandbox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fde-sandbox/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
